[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "polyengine"
version = "0.1.0"
description = "Python bindings for polyengine, a Polytopia engine"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
# stockNavalon's network and training (python/stocknavalon)
train = ["torch"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/polyengine", "python/stocknavalon"]
cmake.build-type = "Release"

# Type checking (Pylance, pyright, basedpyright). The compiled module only
# has a stub next to the sources (python/polyengine/_engine.pyi); the module
# itself is in the build directory, which is expected.
[tool.pyright]
reportMissingModuleSource = "none"
